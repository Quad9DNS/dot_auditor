name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run mypy
      run: |
        python -m mypy dot_auditor.py dot_report.py

    - name: Run pylint
      run: |
        python -m pylint dot_auditor.py dot_report.py --fail-under=9.5

    - name: Run pytest
      run: |
        python -m pytest -v --cov=dot_auditor --cov=dot_report --cov-report=term-missing --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
      with:
        files: ./coverage.xml
        fail_ci_if_error: false

  # Single check for branch protection to require, so the rule survives
  # changes to the python-version matrix above.
  ci:
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
    - name: Verify test matrix passed
      env:
        RESULT: ${{ needs.test.result }}
      run: |
        echo "test matrix result: $RESULT"
        [ "$RESULT" = "success" ] || exit 1
