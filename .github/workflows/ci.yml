name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run mypy
      run: |
        python -m mypy adot_census.py adot_report.py

    - name: Run pylint
      run: |
        python -m pylint adot_census.py adot_report.py --fail-under=9.5

    - name: Run pytest
      run: |
        python -m pytest -v --cov=adot_census --cov=adot_report --cov-report=term-missing --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
      with:
        files: ./coverage.xml
        fail_ci_if_error: false

  # Single check for branch protection to require, so the rule survives
  # changes to the python-version matrix above.
  ci:
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
    - name: Verify test matrix passed
      env:
        RESULT: ${{ needs.test.result }}
      run: |
        echo "test matrix result: $RESULT"
        [ "$RESULT" = "success" ] || exit 1
